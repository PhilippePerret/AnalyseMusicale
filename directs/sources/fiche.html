<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Fiche des directs</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { width: 1920px; height: 1080px; background: #fff; display: flex; flex-direction: column; justify-content: center; padding: 0 200px; }
  header { display: flex; align-items: center; gap: 36px; margin-bottom: 70px; }
  header img { width: 200px; }
  header .cami { font-size: 40px; color: var(--gris); font-weight: 700; letter-spacing: .08em; }
  h1 { font-size: 96px; color: var(--principal); line-height: 1.1; }
  ol { list-style: none; padding: 0; display: grid; grid-template-columns: auto 1fr; gap: 34px 60px; font-size: 46px; }
  ol li { display: contents; }
  ol .quoi { font-weight: 700; color: var(--principal); }
  ol .ou { color: var(--texte); }
  footer { margin-top: 80px; font-size: 40px; color: var(--gris); }
</style></head>
<body>
  <header>
    <img src="logo-carres-lettres-portee-200.jpg" alt="">
    <div><div class="cami">CAMI — CLASSE D’ANALYSE MUSICALE</div><h1>Les jeudis de l’analyse</h1></div>
  </header>
  <ol>
    <li><span class="quoi">Calendrier des directs</span><span class="ou">analyse-musicale.fr/jeudis-analyse</span></li>
    <li><span class="quoi">Cours d’analyse</span><span class="ou">analyse-musicale.fr/cours</span></li>
    <li><span class="quoi">Qui suis-je ?</span><span class="ou">analyse-musicale.fr/pedagogue</span></li>
    <li><span class="quoi">Me contacter</span><span class="ou">analyse-musicale.fr/contact</span></li>
  </ol>
  <footer>www.analyse-musicale.fr</footer>
</body></html>
